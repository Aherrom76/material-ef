<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material EF - Control de Inventario</title>
  <link rel="manifest" href="./manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librerías para exportar en PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-20">

  <!-- Encabezado -->
  <header class="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold">Material EF</h1>
      <p id="info-usuario" class="text-xs text-blue-200">Cargando usuario...</p>
    </div>
    <div class="flex gap-2">
      <button onclick="exportarPDF()" class="bg-blue-700 hover:bg-blue-600 px-3 py-1.5 rounded text-xs font-semibold flex items-center gap-1">📄 PDF</button>
      <button onclick="exportarBackupJSON()" class="bg-blue-700 hover:bg-blue-600 px-3 py-1.5 rounded text-xs font-semibold flex items-center gap-1">💾 Copia</button>
      <button id="btn-admin-usuarios" onclick="abrirModalUsuarios()" class="hidden bg-blue-800 hover:bg-blue-700 px-3 py-1.5 rounded text-xs font-semibold">👥 Usuarios</button>
      <button onclick="cerrarSesion()" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-xs font-semibold">Salir</button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="p-4 max-w-2xl mx-auto">
    <!-- Pantalla de Login -->
    <section id="sec-login" class="bg-white p-6 rounded-lg shadow-md max-w-sm mx-auto my-10">
      <h2 class="text-2xl font-bold mb-4 text-center text-blue-900">Iniciar Sesión</h2>
      <form onsubmit="procesarLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Usuario</label>
          <input type="text" id="login-user" required class="w-full border p-2 rounded mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Contraseña</label>
          <input type="password" id="login-pass" required class="w-full border p-2 rounded mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">Entrar</button>
      </form>
    </section>

    <!-- App de Inventario -->
    <section id="sec-app" class="hidden space-y-4">
      <!-- Buscador y Filtros -->
      <div class="flex gap-2">
        <input type="text" id="input-buscar" oninput="filtrarMateriales()" placeholder="Buscar material..." class="flex-grow border p-2 rounded shadow-sm">
        <button id="btn-filtro-stock" onclick="toggleFiltroStock()" class="bg-gray-200 text-gray-700 px-3 py-2 rounded text-xs font-bold border">⚠️ Bajo Stock</button>
      </div>

      <!-- Lista de Materiales -->
      <div id="lista-materiales" class="space-y-3"></div>
    </section>
  </main>

  <!-- Botón Flotante Agregar Material -->
  <button id="btn-flotante-agregar" onclick="abrirModalMaterial()" class="hidden fixed bottom-6 right-6 bg-blue-900 text-white p-4 rounded-full shadow-lg text-2xl hover:bg-blue-800 z-20">+</button>

  <!-- Modal Crear/Editar Material -->
  <dialog id="modal-material" class="p-6 bg-white rounded-lg shadow-xl w-11/12 max-w-md">
    <h3 id="modal-titulo" class="text-lg font-bold mb-4">Añadir Material</h3>
    <form onsubmit="guardarMaterial(event)" class="space-y-3">
      <input type="hidden" id="mat-id">
      <div>
        <label class="block text-xs font-bold text-gray-600">Nombre</label>
        <input type="text" id="mat-nombre" required class="w-full border p-2 rounded text-sm">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-gray-600">Cantidad</label>
          <input type="number" id="mat-cantidad" min="0" required class="w-full border p-2 rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600">Stock Mínimo</label>
          <input type="number" id="mat-stock-min" min="0" required class="w-full border p-2 rounded text-sm">
        </div>
      </div>

      <!-- CAMPO PARA ADJUNTAR FOTO -->
      <div>
        <label class="block text-xs font-bold text-gray-600">Foto del Material</label>
        <input type="file" id="mat-foto" accept="image/*" onchange="procesarFoto(event)" class="w-full border p-1 rounded text-sm bg-gray-50 mt-1 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200">
        <input type="hidden" id="mat-foto-base64">
        <div id="contenedor-previa" class="hidden mt-2 flex items-center gap-2">
          <img id="vista-previa" class="w-16 h-16 object-cover rounded border" alt="Previa">
          <button type="button" onclick="quitarFoto()" class="text-xs text-red-600 font-bold">Eliminar foto</button>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="document.getElementById('modal-material').close()" class="px-4 py-2 bg-gray-200 rounded text-sm font-bold">Cancelar</button>
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded text-sm font-bold">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Modal Administración de Usuarios -->
  <dialog id="modal-usuarios" class="p-6 bg-white rounded-lg shadow-xl w-11/12 max-w-md">
    <h3 class="text-lg font-bold mb-4">Administrar Usuarios</h3>
    <form onsubmit="crearUsuario(event)" class="space-y-3 mb-4">
      <input type="text" id="nu-user" placeholder="Nombre de usuario" required class="w-full border p-2 rounded text-sm">
      <input type="password" id="nu-pass" placeholder="Contraseña" required class="w-full border p-2 rounded text-sm">
      <select id="nu-rol" class="w-full border p-2 rounded text-sm bg-gray-100">
        <option value="consultor">Consultor (Solo lectura)</option>
        <option value="admin">Administrador (Control total)</option>
      </select>
      <button type="submit" class="w-full bg-green-600 text-white py-2 rounded text-sm font-bold">Guardar Usuario</button>
    </form>
    <div id="lista-usuarios-admin" class="space-y-2 max-h-40 overflow-y-auto border-t pt-3"></div>
    <div class="flex justify-end mt-4">
      <button type="button" onclick="document.getElementById('modal-usuarios').close()" class="px-4 py-2 bg-gray-200 rounded text-sm font-bold">Cerrar</button>
    </div>
  </dialog>

  <!-- CONEXIÓN A FIREBASE Y LÓGICA EN TIEMPO REAL -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Credenciales de Firebase de tu proyecto
    const firebaseConfig = {
      apiKey: "AIzaSyAo4xC0MEHBdCkBLLZcXwtz340bnR16G-I",
      authDomain: "material-ef.firebaseapp.com",
      projectId: "material-ef",
      storageBucket: "material-ef.firebasestorage.app",
      messagingSenderId: "733170759587",
      appId: "1:733170759587:web:a7d12f9eaeb96c6617cc16"
    };

    // Inicialización de Firebase y Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Variables de estado global
    window.materiales = [];
    window.usuarios = [];
    window.usuarioActivo = null;
    window.soloBajoStock = false;

    // 1. ESCUCHADOR EN TIEMPO REAL - MATERIALES
    onSnapshot(collection(db, "materiales"), (snapshot) => {
      window.materiales = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      
      if (snapshot.empty) {
        setDoc(doc(db, "materiales", "1"), { nombre: "Balones de Baloncesto", cantidad: 12, stockMin: 5, foto: "" });
        setDoc(doc(db, "materiales", "2"), { nombre: "Conos de Entrenamiento", cantidad: 3, stockMin: 10, foto: "" });
      }

      if (window.usuarioActivo) window.renderizarMateriales();
    });

    // 2. ESCUCHADOR EN TIEMPO REAL - USUARIOS
    onSnapshot(collection(db, "usuarios"), (snapshot) => {
      window.usuarios = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));

      if (snapshot.empty) {
        setDoc(doc(db, "usuarios", "admin"), { user: "admin", pass: "1234", rol: "admin" });
        setDoc(doc(db, "usuarios", "usuario"), { user: "usuario", pass: "1234", rol: "consultor" });
      }

      if (window.usuarioActivo && window.usuarioActivo.rol === 'admin') {
        window.renderizarListaUsuarios();
      }
    });

    // 3. FUNCIONES ASÍNCRONAS PARA FIRESTORE
    window.guardarMaterialNube = async function(mat) {
      const docId = mat.id ? String(mat.id) : String(Date.now());
      await setDoc(doc(db, "materiales", docId), {
        nombre: mat.nombre,
        cantidad: Number(mat.cantidad),
        stockMin: Number(mat.stockMin),
        foto: mat.foto || ""
      });
    };

    window.eliminarMaterialNube = async function(id) {
      await deleteDoc(doc(db, "materiales", String(id)));
    };

    window.guardarUsuarioNube = async function(usr) {
      await setDoc(doc(db, "usuarios", usr.user), usr);
    };

    window.eliminarUsuarioNube = async function(userId) {
      await deleteDoc(doc(db, "usuarios", userId));
    };
  </script>

  <!-- LÓGICA DE INTERFAZ Y EVENTOS DE LA APP -->
  <script>
    function procesarLogin(e) {
      e.preventDefault();
      const u = document.getElementById('login-user').value.trim();
      const p = document.getElementById('login-pass').value.trim();

      const hallado = window.usuarios.find(x => x.user === u && x.pass === p);
      if (hallado) {
        window.usuarioActivo = hallado;
        document.getElementById('sec-login').classList.add('hidden');
        document.getElementById('sec-app').classList.remove('hidden');
        document.getElementById('info-usuario').innerText = `Usuario: ${hallado.user} (${hallado.rol})`;

        if (hallado.rol === 'admin') {
          document.getElementById('btn-admin-usuarios').classList.remove('hidden');
          document.getElementById('btn-flotante-agregar').classList.remove('hidden');
        }

        renderizarMateriales();
      } else {
        alert("Usuario o contraseña incorrectos");
      }
    }

    function cerrarSesion() {
      window.usuarioActivo = null;
      document.getElementById('sec-app').classList.add('hidden');
      document.getElementById('sec-login').classList.remove('hidden');
      document.getElementById('btn-admin-usuarios').classList.add('hidden');
      document.getElementById('btn-flotante-agregar').classList.add('hidden');
    }

    function renderizarMateriales() {
      const contenedor = document.getElementById('lista-materiales');
      const textoBuscado = document.getElementById('input-buscar').value.toLowerCase();
      contenedor.innerHTML = '';

      const filtrados = window.materiales.filter(m => {
        const coincideNombre = m.nombre.toLowerCase().includes(textoBuscado);
        const coincideBajoStock = window.soloBajoStock ? m.cantidad <= m.stockMin : true;
        return coincideNombre && coincideBajoStock;
      });

      filtrados.forEach(m => {
        const esBajo = m.cantidad <= m.stockMin;
        const div = document.createElement('div');
        div.className = `bg-white p-4 rounded-lg shadow border-l-4 ${esBajo ? 'border-red-500' : 'border-green-500'} flex justify-between items-center gap-3`;

        const esAdmin = window.usuarioActivo && window.usuarioActivo.rol === 'admin';

        div.innerHTML = `
          <div class="flex items-center gap-3">
            ${m.foto ? `<img src="${m.foto}" class="w-12 h-12 rounded object-cover border" alt="Foto">` : `<div class="w-12 h-12 bg-gray-100 rounded flex items-center justify-center text-xs text-gray-400 font-bold border">Sin foto</div>`}
            <div>
              <h4 class="font-bold text-gray-800">${m.nombre}</h4>
              <p class="text-sm text-gray-500">Cantidad: <span class="font-bold text-gray-700">${m.cantidad}</span> (Mín: ${m.stockMin})</p>
              ${esBajo ? '<span class="text-xs text-red-600 font-bold bg-red-100 px-2 py-0.5 rounded">⚠️ Bajo Stock</span>' : ''}
            </div>
          </div>
          ${esAdmin ? `
            <div class="flex items-center gap-2">
              <button onclick="modificarCantidad('${m.id}', -1)" class="bg-gray-200 px-2.5 py-1 rounded font-bold">-</button>
              <button onclick="modificarCantidad('${m.id}', 1)" class="bg-gray-200 px-2.5 py-1 rounded font-bold">+</button>
              <button onclick="editarMaterial('${m.id}')" class="text-blue-600 text-xs font-bold ml-1">Editar</button>
              <button onclick="eliminarMaterial('${m.id}')" class="text-red-600 text-xs font-bold">Borrar</button>
            </div>
          ` : ''}
        `;
        contenedor.appendChild(div);
      });
    }

    function toggleFiltroStock() {
      window.soloBajoStock = !window.soloBajoStock;
      const btn = document.getElementById('btn-filtro-stock');
      btn.className = window.soloBajoStock 
        ? "bg-red-600 text-white px-3 py-2 rounded text-xs font-bold border"
        : "bg-gray-200 text-gray-700 px-3 py-2 rounded text-xs font-bold border";
      renderizarMateriales();
    }

    function filtrarMateriales() {
      renderizarMateriales();
    }

    async function modificarCantidad(id, cambio) {
      const mat = window.materiales.find(m => String(m.id) === String(id));
      if (mat) {
        const nuevaCant = Math.max(0, Number(mat.cantidad) + cambio);
        await window.guardarMaterialNube({ ...mat, cantidad: nuevaCant });
      }
    }

    function abrirModalMaterial() {
      document.getElementById('mat-id').value = '';
      document.getElementById('mat-nombre').value = '';
      document.getElementById('mat-cantidad').value = '0';
      document.getElementById('mat-stock-min').value = '5';
      document.getElementById('mat-foto').value = '';
      document.getElementById('mat-foto-base64').value = '';
      document.getElementById('contenedor-previa').classList.add('hidden');
      document.getElementById('modal-titulo').innerText = 'Añadir Material';
      document.getElementById('modal-material').showModal();
    }

    function editarMaterial(id) {
      const mat = window.materiales.find(m => String(m.id) === String(id));
      if (mat) {
        document.getElementById('mat-id').value = mat.id;
        document.getElementById('mat-nombre').value = mat.nombre;
        document.getElementById('mat-cantidad').value = mat.cantidad;
        document.getElementById('mat-stock-min').value = mat.stockMin;
        document.getElementById('mat-foto').value = '';
        document.getElementById('mat-foto-base64').value = mat.foto || '';

        if (mat.foto) {
          document.getElementById('vista-previa').src = mat.foto;
          document.getElementById('contenedor-previa').classList.remove('hidden');
        } else {
          document.getElementById('contenedor-previa').classList.add('hidden');
        }

        document.getElementById('modal-titulo').innerText = 'Editar Material';
        document.getElementById('modal-material').showModal();
      }
    }

    // PROCESAMIENTO Y COMPRESIÓN DE LA FOTO SELECCIONADA
    function procesarFoto(e) {
      const archivo = e.target.files[0];
      if (!archivo) return;

      const lector = new FileReader();
      lector.onload = function(evento) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 300;
          let ancho = img.width;
          let alto = img.height;

          if (ancho > alto && ancho > maxDim) {
            alto *= maxDim / ancho;
            ancho = maxDim;
          } else if (alto > maxDim) {
            ancho *= maxDim / alto;
            alto = maxDim;
          }

          canvas.width = ancho;
          canvas.height = alto;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, ancho, alto);

          const fotoComprimida = canvas.toDataURL('image/jpeg', 0.7);
          document.getElementById('mat-foto-base64').value = fotoComprimida;
          document.getElementById('vista-previa').src = fotoComprimida;
          document.getElementById('contenedor-previa').classList.remove('hidden');
        };
        img.src = evento.target.result;
      };
      lector.readAsDataURL(archivo);
    }

    function quitarFoto() {
      document.getElementById('mat-foto').value = '';
      document.getElementById('mat-foto-base64').value = '';
      document.getElementById('contenedor-previa').classList.add('hidden');
    }

    async function guardarMaterial(e) {
      e.preventDefault();
      const id = document.getElementById('mat-id').value;
      const mat = {
        id: id || null,
        nombre: document.getElementById('mat-nombre').value.trim(),
        cantidad: document.getElementById('mat-cantidad').value,
        stockMin: document.getElementById('mat-stock-min').value,
        foto: document.getElementById('mat-foto-base64').value
      };
      await window.guardarMaterialNube(mat);
      document.getElementById('modal-material').close();
    }

    async function eliminarMaterial(id) {
      if (confirm("¿Seguro que deseas eliminar este material?")) {
        await window.eliminarMaterialNube(id);
      }
    }

    function abrirModalUsuarios() {
      renderizarListaUsuarios();
      document.getElementById('modal-usuarios').showModal();
    }

    function renderizarListaUsuarios() {
      const cont = document.getElementById('lista-usuarios-admin');
      cont.innerHTML = '';
      window.usuarios.forEach(u => {
        const d = document.createElement('div');
        d.className = "flex justify-between items-center text-xs p-2 bg-gray-50 rounded border";
        d.innerHTML = `
          <span><strong>${u.user}</strong> (${u.rol})</span>
          ${u.user !== 'admin' ? `<button onclick="eliminarUsuario('${u.id || u.user}')" class="text-red-600 font-bold">Borrar</button>` : '<span class="text-gray-400">Principal</span>'}
        `;
        cont.appendChild(d);
      });
    }

    async function crearUsuario(e) {
      e.preventDefault();
      const u = document.getElementById('nu-user').value.trim();
      const p = document.getElementById('nu-pass').value.trim();
      const r = document.getElementById('nu-rol').value;

      await window.guardarUsuarioNube({ user: u, pass: p, rol: r });
      document.getElementById('nu-user').value = '';
      document.getElementById('nu-pass').value = '';
    }

    async function eliminarUsuario(userId) {
      if (confirm("¿Deseas borrar este usuario?")) {
        await window.eliminarUsuarioNube(userId);
      }
    }

    function exportarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(16);
      doc.text("Informe de Inventario - EF", 14, 20);
      doc.setFontSize(10);
      doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 14, 28);

      const filas = window.materiales.map(m => [
        m.nombre,
        m.cantidad,
        m.stockMin,
        m.cantidad <= m.stockMin ? 'Bajo Stock' : 'Correcto'
      ]);

      doc.autoTable({
        startY: 34,
        head: [['Material', 'Cantidad Total', 'Stock Mínimo', 'Estado']],
        body: filas,
        theme: 'striped',
        headStyles: { fillColor: [30, 58, 138] }
      });

      doc.save('inventario_ef.pdf');
    }

    function exportarBackupJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(window.materiales, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", "backup_materiales_ef.json");
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  </script>
</body>
</html>
